# OpenAI-memory baseline: extract-all dump, retrieve-all (privileged context).
# Index first:
#   python -m src.locomo_eval.openai_memory.run_index --config configs/openai_memory.yaml --run-id openai_memory_locomo10
# Then QA:
#   python -m src.locomo_eval.run --config configs/openai_memory.yaml --run-id openai_memory_qa
#
# Architecture clone of the paper's ChatGPT Memory protocol. Not the product
# (no public selective-retrieve API) and not Table 2 J=52.90.

data:
  raw_path: data/raw/locomo10.json
  locomo_commit: 3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376

pipeline:
  memory: openai_memory
  prompt_path: prompts/qa_mem0_v1.txt
  max_questions: null

reader:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 64
  max_retries: 8
  min_request_interval_s: 0.5
  max_wait_s: 3600

openai_memory:
  index_run_id: openai_memory_locomo10
  extract:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 2048
    max_retries: 8
    min_request_interval_s: 0.5
    max_wait_s: 3600
    prompt_path: prompts/openai_memory_extract_v1.txt

run:
  run_id: null
  output_dir: experiments

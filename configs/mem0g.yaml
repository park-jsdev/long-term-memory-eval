# Mem0g = Mem0 vector path PLUS in-memory graph (no Neo4j).
# Index first:
#   python -m src.locomo_eval.mem0.run_index --config configs/mem0g.yaml --run-id mem0g_locomo10
#
# Better-graph RQ: freeze extract/update + this reader/prompt; swap only GraphMemory.
# Relations are serialized into Memory.text; do not swap qa_mem0_v1 for that claim.

data:
  raw_path: data/raw/locomo10.json
  locomo_commit: 3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376

pipeline:
  memory: mem0g
  prompt_path: prompts/qa_mem0_v1.txt
  max_questions: null

reader:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 64
  max_retries: 8
  min_request_interval_s: 0.5
  max_wait_s: 3600

mem0:
  enable_graph: true
  index_run_id: mem0g_locomo10
  batch_size: 2
  similar_s: 10
  top_k: 30
  graph_threshold: 0.7
  extract:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 512
    max_retries: 8
    min_request_interval_s: 0.5
    max_wait_s: 3600
    prompt_path: prompts/mem0_extract_v1.txt
  update:
    prompt_path: prompts/mem0_update_v1.txt
  embed:
    provider: openai
    model: text-embedding-3-small

run:
  run_id: null
  output_dir: experiments

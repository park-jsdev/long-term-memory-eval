# Mem0 LLM-as-a-Judge. Used by scripts.analysis.run_benchmark, not by locomo_eval.run.
# Prompt: https://github.com/mem0ai/mem0/blob/ece7ff6b/evaluation/metrics/llm_judge.py
autorater:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: null
  prompt_path: prompts/autoraters/autorater_mem0_v1.txt
  skip_category: 5
  max_retries: 8
  min_request_interval_s: 0.5
  max_wait_s: 3600

run:
  output_dir: experiments

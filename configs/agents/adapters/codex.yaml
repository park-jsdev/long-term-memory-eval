# OpenAI Codex CLI (https://github.com/openai/codex).
# Live: `codex` on PATH and CODEX_API_KEY or CLI login. Model knobs stay
# minimal — this layer tests the harness, not Chat Completions sampling.
# Windows installer: %LOCALAPPDATA%\Programs\OpenAI\Codex\bin (user PATH).
# Override with CODEX_BIN or agent.codex_bin if the process PATH is stale.
agent:
  id: codex
  adapter: codex
  model: gpt-5

# CLI default (--config if omitted). Standalone YAML, currently C1.
# pipeline.memory is a builder id in memory.py, not a pointer to another YAML.
# Same condition as configs/c1_session_summary.yaml; use c0_raw.yaml for C0.

data:
  raw_path: data/raw/locomo10.json
  # Pin for reproducibility (see data/README.md)
  locomo_commit: 3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376

pipeline:
  memory: c1_session_summary  # builder id, not configs/c1_session_summary.yaml
  prompt_path: prompts/qa_v1.txt
  # null = full set; use a small int for smoke tests
  max_questions: null

reader:
  provider: openai          # openai | mock
  model: gpt-4.1-mini       # cheap default for MVP; set to gpt-4.1 for paper runs
  temperature: 0.0
  max_tokens: 64
  # Free / low tiers often have low RPD (e.g. 50 req/day). Each uncached QA = 1 request.
  max_retries: 8            # on 429, backoff using Retry-After when present
  min_request_interval_s: 0.5
  max_wait_s: 3600          # max sleep per retry when rate limited

run:
  run_id: null              # auto timestamp if null
  output_dir: experiments
  # Future optimization (unwired): src/locomo_eval/utils/llm_response_cache.py
  # llm_response_cache_dir: experiments/cache

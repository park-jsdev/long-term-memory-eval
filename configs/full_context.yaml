# Mem0 paper full-context baseline: entire timestamped dialog, no retrieval.
#   python -m src.locomo_eval.run --config configs/full_context.yaml --run-id full_context_qa
#
# Architecture clone; paper J=72.90 ± 0.19 is a literature pin, not this run.

data:
  raw_path: data/raw/locomo10.json
  locomo_commit: 3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376

pipeline:
  memory: full_context
  prompt_path: prompts/qa_mem0_v1.txt
  max_questions: null

reader:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 64
  max_retries: 8
  min_request_interval_s: 0.5
  max_wait_s: 3600

run:
  run_id: null
  output_dir: experiments

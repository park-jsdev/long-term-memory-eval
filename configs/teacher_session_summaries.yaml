# Live single-teacher session summaries. Swap teacher.model (or --teacher-model)
# within a family. Freeze reader.model when attributing score deltas to the teacher.
#
#   python -m src.locomo_eval.run --config configs/teacher_session_summaries.yaml \
#       --reader mock --teacher mock --teacher-model gpt-4.1-mini \
#       --max-questions 3 --run-id smoke_teacher_mock
#   python -m src.locomo_eval.run --config configs/teacher_session_summaries.yaml \
#       --teacher-model gpt-5.6-luna --max-questions 3 --run-id smoke_teacher_luna

data:
  raw_path: data/raw/locomo10.json
  locomo_commit: 3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376

pipeline:
  memory: teacher_session_summaries
  prompt_path: prompts/qa_mem0_v1.txt
  max_questions: null

reader:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 64
  max_retries: 8
  min_request_interval_s: 0.5
  max_wait_s: 3600

teacher:
  provider: openai
  model: gpt-4.1-mini
  prompt_path: prompts/teacher_session_v1.txt
  temperature: 0.0
  max_tokens: 512
  max_retries: 8
  min_request_interval_s: 0.5
  max_wait_s: 3600

run:
  run_id: null
  output_dir: experiments

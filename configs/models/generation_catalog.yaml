    display_name: GPT-4o
    provider: openai
    family: openai
    generation: 2024
    api_model_id: gpt-4o-2024-08-06
    model_snapshot: gpt-4o-2024-08-06
    status: runnable

  gpt-5:
    display_name: GPT-5
    provider: openai
    family: openai
    generation: 2025
    api_model_id: gpt-5

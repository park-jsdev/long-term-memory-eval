# Mem0 vector write-index + later eval seam (no graph).
# Index first:
#   python -m src.locomo_eval.mem0.run_index --config configs/mem0.yaml --run-id mem0_locomo10
# Then (later eval command; still uses frozen qa_v1 unless you swap the bottom layer):
#   python -m src.locomo_eval.run --config configs/mem0.yaml --reader mock --max-questions 3 --run-id smoke_mem0_read
#
# This YAML does not claim paper Table 1–2 J. Architecture clone only.

data:
  raw_path: data/raw/locomo10.json
  locomo_commit: 3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376

pipeline:
  memory: mem0
  prompt_path: prompts/qa_v1.txt
  max_questions: null

reader:
  provider: openai
  model: gpt-4.1-mini
  temperature: 0.0
  max_tokens: 64
  max_retries: 8
  min_request_interval_s: 0.5
  max_wait_s: 3600

mem0:
  enable_graph: false
  index_run_id: mem0_locomo10
  batch_size: 2
  similar_s: 10
  top_k: 30
  graph_threshold: 0.7
  extract:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 512
    max_retries: 8
    min_request_interval_s: 0.5
    max_wait_s: 3600
    prompt_path: prompts/mem0_extract_v1.txt
  update:
    prompt_path: prompts/mem0_update_v1.txt
  embed:
    provider: openai
    model: text-embedding-3-small

run:
  run_id: null
  output_dir: experiments

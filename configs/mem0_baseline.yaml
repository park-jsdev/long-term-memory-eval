# CLI default: Mem0-parity answer/evaluation controls over session_summaries.
# pipeline.memory is a builder id in memory.py, not a pointer to another YAML.
# Default reader/prompt match Mem0 eval (gpt-4o-mini + qa_mem0_v1). Override
# reader.model / pipeline.prompt_path for a separate robustness axis.
# Memory construction is not Mem0 extraction/update.

data:
  raw_path: data/raw/locomo10.json
  # Pin for reproducibility (see data/README.md)
  locomo_commit: 3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376

pipeline:
  memory: session_summaries  # builder id, not configs/session_summaries.yaml
  prompt_path: prompts/qa_mem0_v1.txt
  # null = full set; use a small int for smoke tests
  max_questions: null

reader:
  provider: openai          # openai | mock
  model: gpt-4o-mini        # Mem0 released evaluation reader
  temperature: 0.0
  max_tokens: null          # Mem0 released reader does not set this field
  message_layout: mem0_system_only
  # Free / low tiers often have low RPD. Every QA is a fresh request.
  max_retries: 8            # on 429, backoff using Retry-After when present
  min_request_interval_s: 0.5
  max_wait_s: 3600          # max sleep per retry when rate limited

run:
  run_id: null              # auto timestamp if null
  output_dir: experiments

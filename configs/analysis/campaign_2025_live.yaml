# Analysis control plane for the 2025 live campaign.
# Recipes only: packs, group_by, metrics, plot kind/x/hue/y.
# Engines: scripts/analysis/campaign_tables.py + campaign_plots.py
# (do not fork plot code per campaign).
#
#   python -m src.memorybench report configs/analysis/campaign_2025_live.yaml
#   python -m src.memorybench report configs/analysis/campaign_2025_live.yaml --experiment smoke
# Notebooks: 03/04/05 (experiment) + 06 (campaign concat).
# Schema: docs/schemas/analysis_campaign.md

campaign:
  id: 2025_live
  title: 2025 live campaign
  freeze_note: >
    Frozen answer prompt qa_mem0_v1 and judge gpt-4o-mini.
    Do not claim Mem0 paper Table 1–2 J. Smoke is 5 questions.

defaults:
  source: examples
  metrics:
    - locomo_f1
    - token_f1
    - exact_match
    - judge_score
  output_subdir: analysis

campaign_analyses:
  - id: reader_family_metrics
    title: Reader family means (same metrics)
    experiments: [smoke, baseline]
    group_by: [model_family]
    plots:
      - kind: metrics_grouped_bar
        hue: model_family
  - id: reader_family_by_memory
    title: Reader family × memory method
    experiments: [smoke, baseline]
    group_by: [model_family, memory_method]
    plots:
      - kind: metrics_grouped_bar
  - id: reader_family_by_category
    title: LoCoMo F1 by family and question category
    experiments: [smoke, baseline]
    group_by: [model_family, question_category]
    metrics: [locomo_f1, judge_score]
    plots:
      - kind: grouped_bar
        x: question_category
        hue: model_family
        y: locomo_f1
  - id: writer_family_by_memory
    title: Writer family × memory method
    experiments: [writers]
    group_by: [model_family, memory_method]
    plots:
      - kind: metrics_grouped_bar

experiments:
  smoke:
    name: locomo-2025-readers-full-context-smoke
    pack: experiments/locomo-2025-readers-full-context-smoke
    notebook: notebooks/03_2025_readers_full_context_analysis.ipynb
    role: reader_sweep
    family_from: reader
    subset: 1 conversation / 5 questions
    analyses:
      - id: by_reader
        title: Per-reader cell means
        group_by: [reader_display_name, memory_method]
        plots:
          - kind: metrics_grouped_bar
      - id: by_category
        title: Per-reader LoCoMo F1 by category
        group_by: [reader_display_name, question_category]
        metrics: [locomo_f1, judge_score]
        plots:
          - kind: grouped_bar
            x: question_category
            hue: reader_display_name
            y: locomo_f1
      - id: latency
        title: Reader latency
        group_by: [reader_display_name]
        metrics: [agent_latency_seconds]
        plots:
          - kind: bar
            x: reader_display_name
            y: agent_latency_seconds
  baseline:
    name: locomo-2025-readers-full-context
    pack: experiments/locomo-2025-readers-full-context
    notebook: notebooks/04_2025_readers_full_context_analysis.ipynb
    role: reader_sweep
    family_from: reader
    analyses:
      - id: by_reader_memory
        title: Reader × {full_context, rag}
        group_by: [reader_display_name, memory_method]
        plots:
          - kind: metrics_grouped_bar
      - id: by_category
        title: Memory method × category
        group_by: [memory_method, question_category]
        metrics: [locomo_f1, judge_score]
        plots:
          - kind: grouped_bar
            x: question_category
            hue: memory_method
            y: locomo_f1
      - id: latency
        title: Reader × memory latency
        group_by: [reader_display_name, memory_method]
        metrics: [agent_latency_seconds]
        plots:
          - kind: bar
            x: reader_display_name
            y: agent_latency_seconds
  writers:
    name: locomo-mem0-reader-2025-writers
    pack: experiments/locomo-mem0-reader-2025-writers
    notebook: notebooks/05_mem0_reader_2025_writers_analysis.ipynb
    role: writer_sweep
    family_from: writer
    analyses:
      - id: by_writer_memory
        title: Writer × {teacher_session_summaries, teacher_graph}
        group_by: [writer_model, memory_method]
        plots:
          - kind: metrics_grouped_bar
      - id: by_category
        title: Memory method × category
        group_by: [memory_method, question_category]
        metrics: [locomo_f1, judge_score]
        plots:
          - kind: grouped_bar
            x: question_category
            hue: memory_method
            y: locomo_f1
      - id: latency
        title: Writer × memory latency
        group_by: [writer_model, memory_method]
        metrics: [agent_latency_seconds]
        plots:
          - kind: bar
            x: writer_model
            y: agent_latency_seconds

# GPT-4o-mini Codex reader/writer proof of concept.
# Native Codex is audit-only unless comparison_status=comparable.
# Paper / local_clone pins are literature context, not OSS-clone Table 2 J.
#
#   python -m src.experiment_runner report configs/analysis/design_openai_codex_poc.yaml
# Notebook: notebooks/17_openai_codex_poc_analysis.ipynb

design:
  id: openai_codex_poc
  title: GPT-4o-mini Codex reader/writer proof of concept
  notebook: notebooks/17_openai_codex_poc_analysis.ipynb
  freeze_note: >
    GPT-4o-mini is the 2024 catalog answer model. Codex CLI is a 2026
    harness around that model — do not read a Codex-mini bar as Mem0
    paper 2024. Thinking is off. Native Codex workspace/tool cells are
    plumbing evidence unless comparison_status is comparable;
    harness_failed is the all-failed cell label, not a 1–2% miss rate.
    Partial misses stay incomparable with harness_failed_rate. Workspace J
    vs LoCoMo F1 uses the same predicted string: F1 is token overlap on
    short gold, J is the Mem0 paraphrase judge. Gold-id recall is union
    over retrieve events (partial chains included). n_web_search / n_mcp
    should be 0 (web_search disabled, user MCP ignored). Frozen-reader writers
    freeze the mini Chat Completions reader; session_summaries /
    agent_codex_mem0_facts / graph are not paper Mem0 extract or
    Mem0g.     Paper and local_clone rows are Table 2 / clone pins (n=1540
    judged subset), not this pack. Do not mix reader-sweep scores into
    the frozen-reader writer claim. Paper / local-clone / gpt-4o-mini + Codex J
    plots use Table 2 method ids. full_context J keeps paper, local clone,
    live Chat Completions, gpt-4o-mini + Codex, and 2025/2026 model-only as
    separate bars. The methods plot is paper vs live model vs Codex (clone
    pins stand in for live model when this pack has no Chat Completions
    cell). Codex facts map to
    mem0 and Codex graph to mem0g for literature context only — not
    paper extract/Mem0g. The reader_stack J plot is a system
    comparison (2024 mini model-only vs 2024 mini+Codex persist-off vs
    paper/local_clone, plus 2025 GPT-5 and 2026 Terra model-only from
    prior OpenAI traces, thinking off). Codex is a 2026 harness around
    the 2024 mini backbone — not a 2024 paper method.

defaults:
  source: runs
  metrics: [locomo_f1, judge_score]
  output_subdir: analysis


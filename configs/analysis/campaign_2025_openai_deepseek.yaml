# Analysis plane for the budget 2025 campaign: OpenAI vs DeepSeek only.
# Pack names stay separate from parked three-family (Claude) cells.
# Thinking-axis recipes: configs/analysis/openai_deepseek_thinking_axis.yaml
#
#   python -m src.memorybench report configs/analysis/campaign_2025_openai_deepseek.yaml
#   python -m src.memorybench report configs/analysis/campaign_2025_openai_deepseek.yaml --experiment smoke
# Parked three-family campaign: configs/analysis/campaign_2025_live.yaml
includes:
  - configs/analysis/campaign_2025_live.yaml
  - configs/analysis/openai_deepseek_thinking_axis.yaml

campaign:
  id: 2025_openai_deepseek
  title: 2025 OpenAI vs DeepSeek
  notebook: notebooks/10_2025_openai_deepseek_campaign_analysis.ipynb
  freeze_note: >
    Same sandwich as 2025_live with Anthropic parked. Frozen answer prompt
    qa_mem0_v1 and judge gpt-4o-mini. Thinking on/off is a matched axis for
    both families as readers and as writers. Do not claim Mem0 paper Table
    1–2 J. Smoke is 5 questions.

cost:
  volume_from:
    baseline: experiments/locomo-2025-readers-openai-deepseek
    writers: experiments/locomo-mem0-reader-2025-writers-openai-deepseek
  scale:
    smoke:
      from_experiment: baseline
      memory_methods: [full_context]

experiments:
  smoke:
    name: locomo-2025-readers-openai-deepseek-smoke
    pack: experiments/locomo-2025-readers-openai-deepseek-smoke
    notebook: notebooks/07_2025_readers_openai_deepseek_smoke_analysis.ipynb
    pretest:
      n_cells: 4
      n_questions: 5
      scientific_claim: false
      hypotheses:
        - "GPT-5 and DeepSeek-V3 each return 5 predictions at thinking off and on."
        - "Smoke cost is well under $1."
        - "Not a quality claim."
        - "Thinking on vs off is a within-family comparison (not averaged across families)."
  baseline:
    name: locomo-2025-readers-openai-deepseek
    pack: experiments/locomo-2025-readers-openai-deepseek
    notebook: notebooks/08_2025_readers_openai_deepseek_analysis.ipynb
    pretest:
      n_cells: 8
      n_questions: 1986
      scientific_claim: true
      hypotheses:
        - "GPT-5 × full_context dominates the bill; thinking-on cells add reasoning tokens."
        - "RAG cells stay on the order of a few dollars."
        - "Quality bars split thinking on vs off within each reader family."
  writers:
    name: locomo-mem0-reader-2025-writers-openai-deepseek
    pack: experiments/locomo-mem0-reader-2025-writers-openai-deepseek
    notebook: notebooks/09_mem0_reader_2025_writers_openai_deepseek_analysis.ipynb
    pretest:
      n_cells: 8
      n_questions: 1986
      scientific_claim: true
      hypotheses:
        - "Frozen gpt-4o-mini reader is a few dollars across eight cells."
        - "Teacher reasoning tokens are the writer-side thinking metric (not reader latency)."
        - "Quality bars split thinking on vs off within each writer family."

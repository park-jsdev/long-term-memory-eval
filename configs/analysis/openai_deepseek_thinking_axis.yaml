# Shared thinking-axis recipes for OpenAI vs DeepSeek campaigns (2025 and 2026).
# Lists replace parked three-family recipes (includes: later keys win).
# Do not include this file from campaign_2025_live.yaml.
#
# Reader thinking tokens come from examples.parquet (per question).
# Writer thinking tokens come from runs.parquet (cost.json teacher rollup).

campaign_analyses:
  - id: reader_family_metrics
    title: Reader family means (same metrics)
    experiments: [smoke, baseline]
    group_by: [model_family, thinking]
    plots:
      - kind: metrics_grouped_bar
        hue: model_family
  - id: reader_family_by_memory
    title: Reader family × memory method × thinking
    experiments: [smoke, baseline]
    group_by: [model_family, memory_method, thinking]
    plots:
      - kind: metrics_grouped_bar
  - id: reader_family_by_category
    title: LoCoMo F1 by family, thinking, and question category
    experiments: [smoke, baseline]
    group_by: [model_family, thinking, question_category]
    metrics: [locomo_f1, judge_score]
    plots:
      - kind: grouped_bar
        x: question_category
        hue: model_family
        y: locomo_f1
  - id: writer_family_by_memory
    title: Writer family × memory method × thinking
    experiments: [writers]
    group_by: [model_family, memory_method, thinking]
    plots:
      - kind: metrics_grouped_bar
  - id: reader_thinking_tokens
    title: Reader reasoning tokens vs latency
    experiments: [smoke, baseline]
    group_by: [model_family, memory_method, thinking]
    metrics: [agent_reasoning_tokens, agent_latency_seconds]
    plots:
      - kind: grouped_bar
        x: thinking
        hue: model_family
        y: agent_reasoning_tokens
      - kind: grouped_bar
        x: thinking
        hue: model_family
        y: agent_latency_seconds
  - id: writer_thinking_tokens
    title: Writer reasoning tokens vs latency
    experiments: [writers]
    source: runs
    group_by: [model_family, memory_method, thinking]
    metrics: [teacher_reasoning_tokens, teacher_latency_seconds]
    plots:
      - kind: grouped_bar
        x: thinking
        hue: model_family
        y: teacher_reasoning_tokens
      - kind: grouped_bar
        x: thinking
        hue: model_family
        y: teacher_latency_seconds

experiments:
  smoke:
    analyses:
      - id: by_reader
        title: Per-reader cell means
        group_by: [reader_display_name, memory_method, thinking]
        plots:
          - kind: metrics_grouped_bar
      - id: by_category
        title: Per-reader LoCoMo F1 by category
        group_by: [reader_display_name, thinking, question_category]
        metrics: [locomo_f1, judge_score]
        plots:
          - kind: grouped_bar
            x: question_category
            hue: reader_display_name
            y: locomo_f1
      - id: latency
        title: Reader latency
        group_by: [reader_display_name, thinking]
        metrics: [agent_latency_seconds]
        plots:
          - kind: grouped_bar
            x: thinking
            hue: reader_display_name
            y: agent_latency_seconds
      - id: thinking_tokens
        title: Reader reasoning tokens vs latency
        group_by: [reader_display_name, thinking]
        metrics: [agent_reasoning_tokens, agent_latency_seconds]
        plots:
          - kind: grouped_bar
            x: thinking
            hue: reader_display_name
            y: agent_reasoning_tokens
          - kind: grouped_bar
            x: thinking
            hue: reader_display_name
            y: agent_latency_seconds
  baseline:
    analyses:
      - id: by_reader_memory
        title: Reader × {full_context, rag} × thinking
        group_by: [reader_display_name, memory_method, thinking]
        plots:
          - kind: metrics_grouped_bar
      - id: by_category
        title: Reader × memory method × thinking × category
        group_by: [reader_display_name, memory_method, thinking, question_category]
        metrics: [locomo_f1, judge_score]
        plots:
          - kind: grouped_bar
            x: question_category
            y: locomo_f1
      - id: latency
        title: Reader × memory × thinking latency
        group_by: [reader_display_name, memory_method, thinking]
        metrics: [agent_latency_seconds]
        plots:
          - kind: grouped_bar
            x: thinking
            hue: reader_display_name
            y: agent_latency_seconds
      - id: thinking_tokens
        title: Reader reasoning tokens vs latency
        group_by: [reader_display_name, memory_method, thinking]
        metrics: [agent_reasoning_tokens, agent_latency_seconds]
        plots:
          - kind: grouped_bar
            x: thinking
            hue: reader_display_name
            y: agent_reasoning_tokens
          - kind: grouped_bar
            x: thinking
            hue: reader_display_name
            y: agent_latency_seconds
  writers:
    analyses:
      - id: by_writer_memory
        title: Writer × {teacher_session_summaries, teacher_graph} × thinking
        group_by: [writer_model, memory_method, thinking]
        plots:
          - kind: metrics_grouped_bar
      - id: by_category
        title: Writer × memory method × thinking × category
        group_by: [writer_model, memory_method, thinking, question_category]
        metrics: [locomo_f1, judge_score]
        plots:
          - kind: grouped_bar
            x: question_category
            y: locomo_f1
      - id: latency
        title: Frozen-reader latency (not teacher think time)
        group_by: [writer_model, memory_method, thinking]
        metrics: [agent_latency_seconds]
        plots:
          - kind: grouped_bar
            x: thinking
            hue: writer_model
            y: agent_latency_seconds
      - id: thinking_tokens
        title: Writer reasoning tokens vs latency
        source: runs
        group_by: [writer_model, memory_method, thinking]
        metrics: [teacher_reasoning_tokens, teacher_latency_seconds]
        plots:
          - kind: grouped_bar
            x: thinking
            hue: writer_model
            y: teacher_reasoning_tokens
          - kind: grouped_bar
            x: thinking
            hue: writer_model
            y: teacher_latency_seconds

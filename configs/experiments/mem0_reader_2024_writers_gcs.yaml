# Live Cloud Run overlay. Dataset: gs://…/data/locomo10.json
#   $env:EXPERIMENT_YAML = "configs/experiments/mem0_reader_2024_writers_gcs.yaml"
#   powershell -ExecutionPolicy Bypass -File .\scripts\deploy_gcp.ps1
includes:
  - configs/experiments/mem0_reader_2024_writers.yaml

storage:
  backend: gcs
  # Bucket comes from $MEMORYBENCH_BUCKET so this config stays account-agnostic.
  dataset_object: data/locomo10.json
  path: /tmp/memorybench-experiments

# Stage 4: 2026 readers × five memory conditions = 15 cells.
# Shared indexes stay frozen except teacher_graph (live write, matched teacher).
# Fill teacher.model snapshots before running teacher_graph cells.

experiment:
  name: locomo-teacher-ablation
  type: ablation
  freeze:
    prompt_path: prompts/readers/qa_mem0_v1.txt

benchmark:
  name: locomo
  dataset_path: data/raw/locomo10.json

model_catalog: configs/models/generation_catalog.yaml

matrix:
  reader:
    - catalog: gpt-5.6-sol
    - catalog: claude-sonnet-5
    - catalog: deepseek-v4-pro
  memory_method:
    - full_context
    - rag
    - mem0
    - session_summaries
    - teacher_graph
  seed:
    - 1

judge:
  provider: openai
  api_model_id: gpt-4o-mini

execution:
  max_concurrency: 3

storage:
  backend: local
  path: experiments

shared_indexes:
  rag:
    index_run_id: rag_locomo10
  mem0:
    index_run_id: mem0_locomo10

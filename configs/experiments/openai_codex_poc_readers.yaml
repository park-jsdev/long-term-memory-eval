# Three GPT-4o-mini reader/harness controls:
# full_context, Codex workspace no-memory, Codex persistent end-to-end.
experiment:
  name: locomo-openai-codex-poc-readers
  type: sweep
  freeze:
    prompt_path: prompts/agents/qa_workspace_v1.txt
benchmark:
  name: locomo
  dataset_path: data/raw/locomo10.json
model_catalog: configs/models/generation_catalog.yaml
matrix:
  reader: [{catalog: gpt-4o-mini}]
  agent: [none, codex]
  agent_persist: [off, on]
  agent_tools: [native]
  memory_method: [full_context, workspace_files]
  seed: [1]
agent_comparison:
  strict: false
  tool_budget: {allowed_tools: [], max_tool_calls: null, max_retrieved_tokens: null, wall_clock_s: 600}
judge:
  provider: openai
  api_model_id: gpt-4o-mini
execution:
  max_concurrency: 1
  request_timeout_seconds: 600
storage:
  backend: local
  path: experiments

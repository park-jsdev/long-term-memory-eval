# Budget overlay of 2025_readers_full_context.yaml: GPT-5 vs DeepSeek-V3 only.
# Matched thinking on/off for both families (reader sweep). Cartesian:
# 2 readers × {full_context, rag} × {off, on} = 8 cells.
# Headroom: off 256 completion tokens, on 8192. Parked three-family YAML
# does not set this axis.
#
#   python -m src.memorybench write-manifest configs/experiments/2025_readers_openai_deepseek.yaml
# Cloud: configs/experiments/2025_readers_openai_deepseek_gcs.yaml
# Smoke: configs/experiments/2025_readers_openai_deepseek_smoke_gcs.yaml
# Analysis: configs/analysis/campaign_2025_openai_deepseek.yaml
# Operator: docs/agent/RUNBOOK_2025_OPENAI_DEEPSEEK.md
includes:
  - configs/experiments/2025_readers_full_context.yaml

experiment:
  name: locomo-2025-readers-openai-deepseek

matrix:
  reader:
    - catalog: gpt-5
    - catalog: deepseek-v3
  thinking:
    - off
    - on

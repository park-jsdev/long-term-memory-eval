# Cloud Run overlay for 2025 teacher writers (6 cells, full LoCoMo).
#   $env:EXPERIMENT_YAML = "configs/experiments/mem0_reader_2025_writers_gcs.yaml"
includes:
  - configs/experiments/mem0_reader_2025_writers.yaml

storage:
  backend: gcs
  # Bucket comes from $MEMORYBENCH_BUCKET so this config stays account-agnostic.
  dataset_object: data/locomo10.json
  path: /tmp/memorybench-experiments

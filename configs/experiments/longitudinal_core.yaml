# Core longitudinal paper matrix:
#   3 years × 3 families × {full_context, rag, mem0} = 27 QA cells.
# Writer is frozen (shared Mem0/RAG indexes). Only the answer model varies.
# Cells with status: to_confirm are listed in the manifest but execute-qa
# refuses them until api_model_id + model_snapshot are pinned.
#
# Do not add a 3-seed multiplier here. Measure question-level variance first.

experiment:
  name: locomo-longitudinal-core
  type: sweep
  freeze:
    prompt_path: prompts/readers/qa_mem0_v1.txt

benchmark:
  name: locomo
  dataset_path: data/raw/locomo10.json

model_catalog: configs/models/generation_catalog.yaml

matrix:
  reader:
    - catalog: gpt-4o              # 2024 openai
    - catalog: gpt-5               # 2025 openai
    - catalog: gpt-5.6-sol         # 2026 openai
    - catalog: claude-3-5-sonnet   # 2024 anthropic
    - catalog: claude-sonnet-4     # 2025 anthropic
    - catalog: claude-sonnet-5     # 2026 anthropic
    - catalog: deepseek-v2.5       # 2024 deepseek
    - catalog: deepseek-v3         # 2025 deepseek
    - catalog: deepseek-v4-pro     # 2026 deepseek
  memory_method:
    - full_context
    - rag
    - mem0
  seed:
    - 1

judge:
  provider: openai
  api_model_id: gpt-4o-mini

execution:
  max_concurrency: 5

storage:
  backend: local
  path: experiments

shared_indexes:
  rag:
    index_run_id: rag_locomo10
    writer: frozen-gpt-4o-mini-embed-text-embedding-3-small
  mem0:
    index_run_id: mem0_locomo10
    writer: frozen-gpt-4o-mini-extract

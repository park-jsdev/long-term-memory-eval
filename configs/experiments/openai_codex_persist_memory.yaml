# Codex persist as a memory method (GPT-4o-mini backbone, thinking off).
# Three cells: persist-off retrieval, persist-on with sessions still visible,
# persist-on notes_only (sessions hidden after ingest). notes_only is the
# memory-method condition. Native Codex stays audit-only unless
# comparison_status=comparable.
#
#   python -m src.experiment_runner write-manifest configs/experiments/openai_codex_persist_memory.yaml
experiment:
  name: locomo-openai-codex-persist-memory
  type: agent
  freeze:
    prompt_path: prompts/agents/qa_workspace_v1.txt
    reader:
      catalog: gpt-4o-mini
benchmark:
  name: locomo
  dataset_path: data/raw/locomo10.json
model_catalog: configs/models/generation_catalog.yaml
matrix:
  agent: [codex]
  agent_persist: [off, on]
  agent_sessions: [full, notes_only]
  agent_tools: [native]
  memory_method: [workspace_files]
  seed: [1]
agent_comparison:
  strict: false
  tool_budget: {allowed_tools: [], max_tool_calls: null, max_retrieved_tokens: null, wall_clock_s: 600}
judge:
  provider: openai
  api_model_id: gpt-4o-mini
execution:
  max_concurrency: 1
  request_timeout_seconds: 600
storage:
  backend: local
  path: experiments

# Frozen GPT-4o-mini reader; OpenAI 2024–2026 writers, thinking explicitly off.
# 4 existing write conditions × 3 writer models = 12 cells.
experiment:
  name: locomo-openai-agent-writers
  type: sandwich
  freeze:
    prompt_path: prompts/readers/qa_mem0_v1.txt
    reader:
      catalog: gpt-4o-mini
benchmark:
  name: locomo
  dataset_path: data/raw/locomo10.json
model_catalog: configs/models/generation_catalog.yaml
matrix:
  writer:
    - catalog: gpt-4o-mini
    - catalog: gpt-5
    - catalog: gpt-5.6-terra
  thinking: [false]
  memory_method: [teacher_session_summaries, teacher_graph, pooled_teacher_graph, fused_teacher_graph]
  seed: [1]
judge:
  provider: openai
  api_model_id: gpt-4o-mini
execution:
  max_concurrency: 1
  request_timeout_seconds: 600
storage:
  backend: local
  path: experiments

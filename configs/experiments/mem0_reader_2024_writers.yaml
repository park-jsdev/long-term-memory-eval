# Sandwich: Mem0-parity answer prompt + frozen GPT-4o reader.
# 2024 Claude 3.5 Sonnet is retired on the Anthropic API — do not launch this YAML.
# Next live studies: 2025_readers_full_context.yaml then mem0_reader_2025_writers.yaml.
#
#   python -m src.memorybench write-manifest configs/experiments/mem0_reader_2024_writers.yaml
# Cloud: configs/experiments/mem0_reader_2024_writers_gcs.yaml
# Protocol notebook: notebooks/02_mem0_reader_2024_writers_protocol.ipynb

experiment:
  name: locomo-mem0-reader-2024-writers
  type: sandwich
  freeze:
    prompt_path: prompts/readers/qa_mem0_v1.txt
    reader:
      catalog: gpt-4o
    judge:
      provider: openai
      api_model_id: gpt-4o-mini

benchmark:
  name: locomo
  dataset_path: data/raw/locomo10.json

model_catalog: configs/models/generation_catalog.yaml

matrix:
  memory_method:
    - full_context
    - teacher_graph
  writer:
    - none
    - catalog: gpt-4o
    - catalog: claude-3-5-sonnet
  seed:
    - 1

judge:
  provider: openai
  api_model_id: gpt-4o-mini

execution:
  max_concurrency: 1
  request_timeout_seconds: 180
  max_api_retries: 8

storage:
  backend: local
  path: experiments

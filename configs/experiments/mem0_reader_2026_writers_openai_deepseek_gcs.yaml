# Cloud Run overlay for 2026 OpenAI vs DeepSeek writers (8 cells, full LoCoMo).
#   $env:EXPERIMENT_YAML = "configs/experiments/mem0_reader_2026_writers_openai_deepseek_gcs.yaml"
includes:
  - configs/experiments/mem0_reader_2026_writers_openai_deepseek.yaml

storage:
  backend: gcs
  # Bucket comes from $MEMORYBENCH_BUCKET so this config stays account-agnostic.
  dataset_object: data/locomo10.json
  path: /tmp/memorybench-experiments

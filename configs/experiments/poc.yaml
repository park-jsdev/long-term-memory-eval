# Milestone-1 plumbing: 1 conversation, mock reader, no write-index.
#   python -m src.memorybench write-manifest configs/experiments/poc.yaml
#   python -m src.memorybench execute-qa configs/experiments/poc.yaml --run-index 0
#   python -m src.memorybench execute-autorater configs/experiments/poc.yaml --run-index 0
#   python -m src.memorybench status configs/experiments/poc.yaml
#   python -m src.memorybench aggregate configs/experiments/poc.yaml

experiment:
  name: locomo-poc
  type: calibration
  seed: 42
  freeze:
    prompt_path: prompts/readers/qa_mem0_v1.txt
    reader:
      catalog: gpt-4o-mini

benchmark:
  name: locomo
  dataset_path: data/raw/locomo10.json

model_catalog: configs/models/generation_catalog.yaml

matrix:
  memory_method:
    - full_context
  seed:
    - 1

subset:
  max_samples: 1
  max_questions: 3

judge:
  provider: openai
  api_model_id: gpt-4o-mini

execution:
  reader_provider: mock
  judge_provider: mock
  max_concurrency: 1
  request_timeout_seconds: 120
  max_api_retries: 5

storage:
  backend: local
  path: experiments

shared_indexes: {}

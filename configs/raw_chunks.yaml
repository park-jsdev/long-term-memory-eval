# Raw dialog turns (session chunks). Standalone YAML — not a child config.
#   python -m src.locomo_eval.run --config configs/raw_chunks.yaml --run-id ...
# Sanity memory vs mem0: freeze reader/prompt (gpt-4o-mini + qa_mem0_v1).

data:
  raw_path: data/raw/locomo10.json
  locomo_commit: 3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376

pipeline:
  memory: raw_chunks
  # Optional rough char budget for answer-model context (null = full dialog)
  memory_max_chars: 120000
  prompt_path: prompts/qa_mem0_v1.txt
  max_questions: null

reader:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 64
  max_retries: 8
  min_request_interval_s: 0.5
  max_wait_s: 3600

run:
  run_id: null
  output_dir: experiments
